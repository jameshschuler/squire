services:
  - type: web
    name: squire-api
    runtime: node
    plan: free
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm --filter @squire/api build
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - apps/api/**
        - packages/data-client/**
        - pnpm-lock.yaml
    envVars:
      - key: WALKSCAPE_API_KEY
        sync: false
      - key: WALKSCAPE_ENV
        value: prod
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: squire-web
    runtime: static
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm --filter @squire/web build
    staticPublishPath: apps/web/dist
    buildFilter:
      paths:
        - apps/web/**
        - apps/api/src/recipe-book/**
        - apps/api/src/character/**
        - apps/api/package.json
        - packages/data-client/**
        - pnpm-lock.yaml
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
