name: API contract

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  types:
    name: Generated types match the spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @walkscape-community/data-api-client generate
      - name: Fail if the spec changed
        run: |
          if ! git diff --exit-code --stat packages/data-client/src/generated; then
            echo "::error::The API spec changed. Run the generate script, check the diff and release the data client."
            exit 1
          fi

  responses:
    name: Live responses match the spec
    runs-on: ubuntu-latest
    env:
      WALKSCAPE_API_KEY: ${{ secrets.WALKSCAPE_API_KEY }}
    steps:
      - name: Require the API key
        run: |
          if [ -z "$WALKSCAPE_API_KEY" ]; then
            echo "::error::Add the WALKSCAPE_API_KEY repository secret."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - working-directory: packages/data-client
        run: pnpm exec vitest run test/contract.live.test.ts
