name: Release data client

on:
  push:
    tags: ["data-client-v*"]

permissions: {}

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          check-latest: true
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches the package version
        run: |
          version=$(node -p "require('./packages/data-client/package.json').version")
          if [ "$GITHUB_REF_NAME" != "data-client-v$version" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @walkscape-community/data-api-client typecheck
      - run: pnpm --filter @walkscape-community/data-api-client test
      - run: pnpm --filter @walkscape-community/data-api-client build
      - name: Pack
        working-directory: packages/data-client
        run: pnpm pack --pack-destination "$RUNNER_TEMP"
      - name: Install the packed package and use it
        working-directory: packages/data-client
        run: node scripts/check-package.mjs "$RUNNER_TEMP/walkscape-community-data-api-client-$VERSION.tgz"
      - name: Stage on npm for approval, unless this version is already published
        run: |
          if npm view "@walkscape-community/data-api-client@$VERSION" version > /dev/null 2>&1; then
            echo "$VERSION is already on npm"
          else
            npm stage publish "$RUNNER_TEMP/walkscape-community-data-api-client-$VERSION.tgz" --access public
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME"
          --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/$GITHUB_REF_NAME/packages/data-client/CHANGELOG.md)."
